name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-test:
    name: App — lint & Jest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synaro_ci?schema=public
      NEXTAUTH_SECRET: ci-test-secret-for-jest-only-min-32-chars
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: Jest (unit & API route tests)
        run: npm run test:ci

  app-e2e:
    name: App — Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        working-directory: app

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synaro_e2e?schema=public
      NEXTAUTH_SECRET: ci-test-secret-for-jest-only-min-32-chars
      NEXTAUTH_URL: http://localhost:3000
      E2E_USER_EMAIL: e2e@synaro.test
      E2E_USER_PASSWORD: e2e-ci-test-password-12
      CI: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synaro_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synaro_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  app-a11y:
    name: App — Playwright A11y
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: false
    defaults:
      run:
        working-directory: app

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synaro_a11y?schema=public
      NEXTAUTH_SECRET: ci-test-secret-for-jest-only-min-32-chars
      NEXTAUTH_URL: http://localhost:3000
      E2E_USER_EMAIL: e2e@synaro.test
      E2E_USER_PASSWORD: e2e-ci-test-password-12
      CI: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synaro_a11y
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synaro_a11y"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright accessibility
        run: npm run test:a11y:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-report
          path: app/playwright-report/
          retention-days: 7
