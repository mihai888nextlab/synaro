services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    container_name: synaro-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://synaro_user:synaro_local_password@postgresql:5432/synaro
      NEXTAUTH_URL: https://synaro.tech
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      ENVIRONMENT_SERVICE_URL: http://environment-service:3002
      AI_ORCHESTRATION_URL: http://ai-orchestration-service:3003
      AI_SERVICE_URL: http://ai-orchestration-service:3003
      NODE_ENV: production
      NEXT_PUBLIC_AGENT_CRON_TIMEZONE: ${AGENT_CRON_TIMEZONE:-Europe/Bucharest}
    ports:
      - '3080:3000'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgresql:
        condition: service_healthy

  postgresql:
    image: postgres:16-alpine
    container_name: synaro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synaro
      POSTGRES_USER: synaro_user
      POSTGRES_PASSWORD: synaro_local_password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init-project-service-db.sh:/docker-entrypoint-initdb.d/01-synaro-project-service-db.sh
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U synaro_user -d synaro' ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgresql-env:
    image: postgres:16-alpine
    container_name: synaro-postgres-env
    restart: unless-stopped
    environment:
      POSTGRES_DB: synaro_env
      POSTGRES_USER: synaro_env_user
      POSTGRES_PASSWORD: synaro_env_local_password
    ports:
      - '5434:5432'
    volumes:
      - postgres_env_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U synaro_env_user -d synaro_env' ]
      interval: 10s
      timeout: 5s
      retries: 5

  project-service:
    build:
      context: ./services/project-service
      dockerfile: Dockerfile.dev
    container_name: synaro-project-service
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://synaro_user:synaro_local_password@postgresql:5432/synaro_project_service
      NODE_ENV: development
      PORT: 3001
      LOG_LEVEL: info
      ALLOWED_ORIGINS: https://synaro.tech
    volumes:
      - ./services/project-service/src:/app/src
      - ./services/project-service/prisma:/app/prisma
    depends_on:
      postgresql:
        condition: service_healthy

  environment-service:
    build:
      context: ./services/environment-service
      dockerfile: Dockerfile.dev
    container_name: synaro-environment-service
    restart: unless-stopped
    command:
      [
        'sh',
        '-c',
        'npx prisma migrate deploy && npx prisma generate && exec npx tsx watch src/index.ts',
      ]
    ports:
      - '3004:3002'
    environment:
      DATABASE_URL: postgresql://synaro_env_user:synaro_env_local_password@postgresql-env:5432/synaro_env
      NODE_ENV: development
      PORT: 3002
      LOG_LEVEL: info
      ALLOWED_ORIGINS: https://synaro.tech
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    volumes:
      - ./services/environment-service/src:/app/src
      - ./services/environment-service/prisma:/app/prisma
      - ./services/environment-service/package.json:/app/package.json
      - ./services/environment-service/package-lock.json:/app/package-lock.json
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgresql-env:
        condition: service_healthy

  ai-orchestration-service:
    build:
      context: ./services/ai-orchestration-service
      dockerfile: Dockerfile.dev
    container_name: synaro-ai-orchestration-service
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      DATABASE_URL: postgresql://synaro_user:synaro_local_password@postgresql:5432/synaro
      NODE_ENV: development
      PORT: 3003
      LOG_LEVEL: info
      ALLOWED_ORIGINS: https://synaro.tech
      KIMI_API_KEY: ${KIMI_API_KEY}
      ENVIRONMENT_SERVICE_URL: http://environment-service:3002
    volumes:
      - ./services/ai-orchestration-service/src:/app/src
      - ./services/ai-orchestration-service/prisma:/app/prisma
    depends_on:
      postgresql:
        condition: service_healthy

  execution-manager:
    build:
      context: ./services/execution-manager
      dockerfile: Dockerfile.dev
    container_name: synaro-execution-manager
    restart: unless-stopped
    ports:
      - '3005:3004'
    environment:
      DATABASE_URL: postgresql://synaro_user:synaro_local_password@postgresql:5432/synaro
      NODE_ENV: development
      PORT: 3004
      LOG_LEVEL: info
      PROJECTS_PATH: /projects
      PROJECTS_VOLUME_PATH: /var/lib/docker/volumes/synaro_projects_data/_data
    volumes:
      - ./services/execution-manager/src:/app/src
      - ./services/execution-manager/prisma:/app/prisma
      - /var/run/docker.sock:/var/run/docker.sock
      - projects_data:/projects
    depends_on:
      postgresql:
        condition: service_healthy

  agent-service:
    build:
      context: ./services/agent-service
      dockerfile: Dockerfile.dev
    container_name: synaro-agent-service
    restart: unless-stopped
    ports:
      - '3007:3005'
    environment:
      DATABASE_URL: postgresql://synaro_user:synaro_local_password@postgresql:5432/synaro
      NODE_ENV: development
      PORT: 3005
      LOG_LEVEL: info
      CORS_ORIGIN: '*'
      AGENT_SERVICE_KEY: ${AGENT_SERVICE_KEY:-synaro-agent-key-dev}
      AGENT_RUNNER_URL: http://agent-runner:3006
      APP_INTERNAL_URL: ${APP_INTERNAL_URL:-http://host.docker.internal:3000}
    volumes:
      - ./services/agent-service/src:/app/src
      - ./services/agent-service/prisma:/app/prisma
    depends_on:
      postgresql:
        condition: service_healthy

  agent-runner:
    build:
      context: ./services/agent-runner
      dockerfile: Dockerfile.dev
    container_name: synaro-agent-runner
    restart: unless-stopped
    ports:
      - '3008:3006'
    environment:
      DATABASE_URL: postgresql://synaro_user:synaro_local_password@postgresql:5432/synaro
      NODE_ENV: development
      PORT: 3006
      LOG_LEVEL: info
      KIMI_API_KEY: ${KIMI_API_KEY}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      AGENT_SERVICE_URL: http://agent-service:3005
      AGENT_SERVICE_KEY: ${AGENT_SERVICE_KEY:-synaro-agent-key-dev}
      AGENT_CRON_TIMEZONE: ${AGENT_CRON_TIMEZONE:-Europe/Bucharest}
      ENVIRONMENT_SERVICE_URL: http://environment-service:3002
      WORKSPACES_PATH: /workspaces
    volumes:
      - ./services/agent-runner/src:/app/src
      - ./services/agent-runner/prisma:/app/prisma
      - agent_workspaces:/workspaces
    depends_on:
      postgresql:
        condition: service_healthy
      agent-service:
        condition: service_started

  # Minimal MCP server for testing agents' MCP client (tools: echo, add, current_time).
  # Reuses the agent-runner image (already has @modelcontextprotocol/sdk + zod).
  # Reachable from agent-runner at http://mcp-test:9100/mcp
  mcp-test:
    image: synaro-agent-runner:latest
    container_name: synaro-mcp-test
    restart: unless-stopped
    working_dir: /app
    command: ["node", "scripts/mcp-test-server.mjs"]
    ports:
      - '9100:9100'
    volumes:
      - ./scripts/mcp-test-server.mjs:/app/scripts/mcp-test-server.mjs:ro

  adminer:
    image: adminer:latest
    container_name: synaro-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgresql:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_env_data:
  projects_data:
  agent_workspaces:
