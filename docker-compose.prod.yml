##############################################################################
# Synaro — Production / VPS docker-compose
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Prerequisites on the VPS:
#   1. docker network create traefik-net
#   2. Create .env.prod with variables listed below
#   3. DNS records:
#        synaro.ro    → <VPS IP>
#        *.synaro.ro  → <VPS IP>
#
# Required .env.prod variables:
#   POSTGRES_PASSWORD
#   SYNARO_DOMAIN        e.g. synaro.ro
#   ACME_EMAIL           e.g. admin@synaro.ro
#   NEXTAUTH_SECRET
#   NEXTAUTH_URL         e.g. https://synaro.ro
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   GITHUB_CLIENT_ID
#   GITHUB_CLIENT_SECRET
#   KIMI_API_KEY
#   RESEND_API_KEY       Resend key for the synaro.tech domain (enables auth emails)
#   RESEND_FROM          optional; defaults to "Synaro <noreply@synaro.tech>"
##############################################################################

networks:
  synaro-internal:
    driver: bridge
  traefik-net:
    external: true

volumes:
  postgres_data:
  projects_data:

services:

  # ---------------------------------------------------------------------------
  # Traefik — reverse proxy + SSL
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v2.11
    container_name: synaro-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.network=traefik-net"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      #- "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      #- "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      #- "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      #- "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      #- "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--log.level=DEBUG"
      - "--providers.file.directory=/etc/traefik/conf.d/tls.yml"
      - "--providers.file.watch=true"
      - "--accesslog=true"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      #- ./letsencrypt:/letsencrypt
      - ./traefik:/etc/traefik/conf.d
    networks:
      - traefik-net

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgresql:
    image: postgres:16-alpine
    container_name: synaro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synaro
      POSTGRES_USER: synaro_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init.sh
    networks:
      - synaro-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synaro_user -d synaro"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Project service
  # ---------------------------------------------------------------------------
  project-service:
    build:
      context: ./services/project-service
      dockerfile: Dockerfile.dev
    container_name: synaro-project-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://synaro_user:${POSTGRES_PASSWORD}@postgresql:5432/synaro
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: info
      ALLOWED_ORIGINS: https://${SYNARO_DOMAIN}
    volumes:
      - ./services/project-service/src:/app/src
      - ./services/project-service/prisma:/app/prisma
    networks:
      - synaro-internal
    depends_on:
      postgresql:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Environment service
  # ---------------------------------------------------------------------------
  environment-service:
    build:
      context: ./services/environment-service
      dockerfile: Dockerfile.dev
    container_name: synaro-environment-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://synaro_user:${POSTGRES_PASSWORD}@postgresql:5432/synaro
      NODE_ENV: production
      PORT: 3002
      LOG_LEVEL: info
      ALLOWED_ORIGINS: https://${SYNARO_DOMAIN}
      # Set => project containers get Traefik labels + a {subdomain}.{domain} URL.
      # Unset => they fall back to dev-style host ports, which prod cannot route.
      SYNARO_DOMAIN: ${SYNARO_DOMAIN}
      # terminal-ws-token.ts throws at startup without one of these.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./services/environment-service/src:/app/src
      - ./services/environment-service/prisma:/app/prisma
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      # Expose ONLY the token-authenticated terminal WebSocket publicly. The rest of the
      # environment-service REST API is unauthenticated and MUST stay internal-only, so this
      # router is scoped to the exact /terminal/ws path (Traefik v2 named-regex path matcher).
      # HTTPS (Cloudflare "Full" → Traefik :443).
      - "traefik.http.routers.synaro-terminal.rule=Host(`synaro.tech`) && Path(`/api/environments/{id:[^/]+}/terminal/ws`)"
      - "traefik.http.routers.synaro-terminal.entrypoints=websecure"
      - "traefik.http.routers.synaro-terminal.tls=true"
      - "traefik.http.routers.synaro-terminal.tls.options=default"
      - "traefik.http.routers.synaro-terminal.priority=100"
      - "traefik.http.routers.synaro-terminal.service=synaro-terminal"
      # HTTP (in case Cloudflare reaches the origin on :80) — same scoped path.
      - "traefik.http.routers.synaro-terminal-http.rule=Host(`synaro.tech`) && Path(`/api/environments/{id:[^/]+}/terminal/ws`)"
      - "traefik.http.routers.synaro-terminal-http.entrypoints=web"
      - "traefik.http.routers.synaro-terminal-http.priority=100"
      - "traefik.http.routers.synaro-terminal-http.service=synaro-terminal"
      - "traefik.http.services.synaro-terminal.loadbalancer.server.port=3002"
    networks:
      - synaro-internal
      - traefik-net
    depends_on:
      postgresql:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # AI orchestration service
  # ---------------------------------------------------------------------------
  ai-orchestration-service:
    build:
      context: ./services/ai-orchestration-service
      dockerfile: Dockerfile.dev
    container_name: synaro-ai-orchestration-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://synaro_user:${POSTGRES_PASSWORD}@postgresql:5432/synaro
      NODE_ENV: production
      PORT: 3003
      LOG_LEVEL: info
      ALLOWED_ORIGINS: https://${SYNARO_DOMAIN}
      KIMI_API_KEY: ${KIMI_API_KEY}
      PROJECTS_PATH: /projects
      ENVIRONMENT_SERVICE_URL: http://environment-service:3002
      # Set ORCHESTRATOR_MODE=agent in .env to run the agentic tool-loop; empty = the classic pipeline.
      ORCHESTRATOR_MODE: ${ORCHESTRATOR_MODE:-}
      # Set AGENT_SUBAGENTS=true to let the agent delegate read-only exploration to sub-agents.
      AGENT_SUBAGENTS: ${AGENT_SUBAGENTS:-}
    volumes:
      - projects_data:/projects
      - ./services/ai-orchestration-service/src:/app/src
      - ./services/ai-orchestration-service/prisma:/app/prisma
    networks:
      - synaro-internal
    depends_on:
      postgresql:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Execution manager
  # ---------------------------------------------------------------------------
  execution-manager:
    build:
      context: ./services/execution-manager
      dockerfile: Dockerfile.dev
    container_name: synaro-execution-manager
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://synaro_user:${POSTGRES_PASSWORD}@postgresql:5432/synaro
      NODE_ENV: production
      PORT: 3004
      LOG_LEVEL: info
      # The manager reads PROJECTS_VOLUME_PATH; without it, it falls back to a
      # host path that does not exist inside this container.
      PROJECTS_VOLUME_PATH: /projects
      PROJECTS_PATH: /projects
      K8S_NAMESPACE: synaro-projects
      BASE_DOMAIN: ${SYNARO_DOMAIN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - projects_data:/projects
      - /etc/rancher/k3s/k3s.yaml:/root/.kube/config:ro
      - ./services/execution-manager/src:/app/src
      - ./services/execution-manager/prisma:/app/prisma
    networks:
      - synaro-internal
    depends_on:
      postgresql:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Agent service
  # ---------------------------------------------------------------------------
  agent-service:
    build:
      context: ./services/agent-service
      dockerfile: Dockerfile.dev
    container_name: synaro-agent-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://synaro_user:${POSTGRES_PASSWORD}@postgresql:5432/synaro
      NODE_ENV: production
      PORT: 3005
      LOG_LEVEL: info
      ALLOWED_ORIGINS: https://${SYNARO_DOMAIN}
      # index.ts reads CORS_ORIGIN, not ALLOWED_ORIGINS; without it CORS defaults to '*'.
      CORS_ORIGIN: https://${SYNARO_DOMAIN}
      AGENT_RUNNER_URL: http://agent-runner:3006
      AGENT_SERVICE_KEY: ${AGENT_SERVICE_KEY}
      APP_INTERNAL_URL: http://app:3000
    volumes:
      - ./services/agent-service/src:/app/src
      - ./services/agent-service/prisma:/app/prisma
    networks:
      - synaro-internal
    depends_on:
      postgresql:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Agent runner
  # ---------------------------------------------------------------------------
  agent-runner:
    build:
      context: ./services/agent-runner
      dockerfile: Dockerfile.dev
    container_name: synaro-agent-runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://synaro_user:${POSTGRES_PASSWORD}@postgresql:5432/synaro
      NODE_ENV: production
      PORT: 3006
      LOG_LEVEL: info
      KIMI_API_KEY: ${KIMI_API_KEY}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      AGENT_SERVICE_URL: http://agent-service:3005
      AGENT_SERVICE_KEY: ${AGENT_SERVICE_KEY}
      AGENT_CRON_TIMEZONE: ${AGENT_CRON_TIMEZONE:-Europe/Bucharest}
    volumes:
      - ./services/agent-runner/src:/app/src
      - ./services/agent-runner/prisma:/app/prisma
    networks:
      - synaro-internal
    depends_on:
      postgresql:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Next.js frontend — https://synaro.ro
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    container_name: synaro-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://synaro_user:${POSTGRES_PASSWORD}@postgresql:5432/synaro_frontend
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM:-Synaro <noreply@synaro.tech>}
      # Server-side service URLs (read by API routes; the NEXT_PUBLIC_* vars below
      # are client bundles only and are NOT read by server code).
      ENVIRONMENT_SERVICE_URL: http://environment-service:3002
      AI_SERVICE_URL: http://ai-orchestration-service:3003
      AGENT_SERVICE_URL: http://agent-service:3005
      AGENT_SERVICE_KEY: ${AGENT_SERVICE_KEY}
      # Comma-separated emails allowed into /admin/demo (the demo-account dashboard).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEMO_EMAIL_DOMAIN: ${DEMO_EMAIL_DOMAIN:-synaro.demo}
      NEXT_PUBLIC_PROJECT_SERVICE_URL: http://project-service:3001
      NEXT_PUBLIC_AI_SERVICE_URL: http://ai-orchestration-service:3003
      NEXT_PUBLIC_AGENT_SERVICE_URL: http://agent-service:3005
      NEXT_PUBLIC_AGENT_CRON_TIMEZONE: ${AGENT_CRON_TIMEZONE:-Europe/Bucharest}
      NODE_ENV: production
    labels:
      - "traefik.enable=true"
      # Router HTTPS
      - "traefik.http.routers.synaro-app.rule=Host(`synaro.tech`)"
      - "traefik.http.routers.synaro-app.entrypoints=websecure"
      - "traefik.http.routers.synaro-app.tls=true"
      #- "traefik.http.routers.synaro-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.synaro-app.loadbalancer.server.port=3000"
      # Router HTTP - pentru Cloudflare proxy
      - "traefik.http.routers.synaro-app-http.rule=Host(`synaro.tech`)"
      - "traefik.http.routers.synaro-app-http.entrypoints=web"
      - "traefik.http.routers.synaro-app-http.service=synaro-app"
      # Router HTTP — doar redirect, dar NU pentru acme challenge
      #- "traefik.http.routers.synaro-app-http.rule=Host(`synaro.tech`) && !PathPrefix(`/.well-known/acme-challenge`)"
      - "traefik.http.routers.synaro-app-http.entrypoints=web"
      #- "traefik.http.routers.synaro-app-http.middlewares=redirect-to-https@docker"
      # Middleware redirect
      #- "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      #- "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      #test
      - "traefik.http.routers.synaro-app.tls.options=default"
      - "traefik.http.routers.synaro-app.tls.domains[0].main=synaro.tech"
    networks:
      - synaro-internal
      - traefik-net
    depends_on:
      postgresql:
        condition: service_healthy
      project-service:
        condition: service_started
      environment-service:
        condition: service_started
      ai-orchestration-service:
        condition: service_started
      agent-service:
        condition: service_started
