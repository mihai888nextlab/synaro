version: '3.9'

services:
  postgresql:
    image: postgres:16-alpine
    container_name: synaro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synaro
      POSTGRES_USER: synaro_user
      POSTGRES_PASSWORD: synaro_local_password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synaro_user -d synaro']
      interval: 10s
      timeout: 5s
      retries: 5

  project-service:
    build:
      context: ./services/project-service
      dockerfile: Dockerfile.dev
    container_name: synaro-project-service
    restart: unless-stopped
    ports:
      - '3002:3001'
    environment:
      DATABASE_URL: postgresql://synaro_user:synaro_local_password@postgresql:5432/synaro
      NODE_ENV: development
      PORT: 3001
      LOG_LEVEL: debug
      ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./services/project-service/src:/app/src
      - ./services/project-service/prisma:/app/prisma
    depends_on:
      postgresql:
        condition: service_healthy

volumes:
  postgres_data:
