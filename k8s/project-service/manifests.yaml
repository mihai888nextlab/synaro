apiVersion: v1
kind: Secret
metadata:
  name: project-service-secret
  namespace: synaro
type: Opaque
stringData:
  DATABASE_URL: postgresql://synaro_user:synaro123@postgresql.synaro.svc.cluster.local:5432/synaro

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-service
  namespace: synaro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project-service
  template:
    metadata:
      labels:
        app: project-service
    spec:
      containers:
        - name: project-service
          image: synaro/project-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: project-service-secret
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 300m
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: project-service
  namespace: synaro
spec:
  selector:
    app: project-service
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: project-service-ingress
  namespace: synaro
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - path: /api/projects
            pathType: Prefix
            backend:
              service:
                name: project-service
                port:
                  number: 3001
