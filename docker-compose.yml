services:
  postgresql:
    image: postgres:16-alpine
    container_name: synaro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synaro
      POSTGRES_USER: synaro_user
      POSTGRES_PASSWORD: synaro_local_password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init-project-service-db.sh:/docker-entrypoint-initdb.d/01-synaro-project-service-db.sh
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U synaro_user -d synaro' ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Isolated DB for environment-service (Prisma enums + migrations must not clash with the app schema on `synaro`.)
  postgresql-env:
    image: postgres:16-alpine
    container_name: synaro-postgres-env
    restart: unless-stopped
    environment:
      POSTGRES_DB: synaro_env
      POSTGRES_USER: synaro_env_user
      POSTGRES_PASSWORD: synaro_env_local_password
    ports:
      - '5434:5432'
    volumes:
      - postgres_env_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U synaro_env_user -d synaro_env' ]
      interval: 10s
      timeout: 5s
      retries: 5

  project-service:
    build:
      context: ./services/project-service
      dockerfile: Dockerfile.dev
    container_name: synaro-project-service
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://synaro_user:synaro_local_password@postgresql:5432/synaro_project_service
      NODE_ENV: development
      PORT: 3001
      LOG_LEVEL: info
      ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./services/project-service/src:/app/src
      - ./services/project-service/prisma:/app/prisma
    depends_on:
      postgresql:
        condition: service_healthy

  environment-service:
    build:
      context: ./services/environment-service
      dockerfile: Dockerfile.dev
    container_name: synaro-environment-service
    restart: unless-stopped
    # Prisma schema is bind-mounted; client in node_modules must be regenerated on each start.
    # Do not rely on image-baked package.json "dev" script — recreate container after compose changes.
    command:
      [
        'sh',
        '-c',
        'npx prisma migrate deploy && npx prisma generate && exec npx tsx watch src/index.ts',
      ]
    ports:
      - '3004:3002'
    environment:
      DATABASE_URL: postgresql://synaro_env_user:synaro_env_local_password@postgresql-env:5432/synaro_env
      NODE_ENV: development
      PORT: 3002
      LOG_LEVEL: info
      ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./services/environment-service/src:/app/src
      - ./services/environment-service/prisma:/app/prisma
      - ./services/environment-service/package.json:/app/package.json
      - ./services/environment-service/package-lock.json:/app/package-lock.json
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgresql-env:
        condition: service_healthy

  ai-orchestration-service:
    build:
      context: ./services/ai-orchestration-service
      dockerfile: Dockerfile.dev
    container_name: synaro-ai-orchestration-service
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      DATABASE_URL: postgresql://synaro_user:synaro_local_password@postgresql:5432/synaro
      NODE_ENV: development
      PORT: 3003
      LOG_LEVEL: info
      ALLOWED_ORIGINS: http://localhost:3000
      KIMI_API_KEY: ${KIMI_API_KEY}
      ENVIRONMENT_SERVICE_URL: http://environment-service:3002
    volumes:
      - ./services/ai-orchestration-service/src:/app/src
      - ./services/ai-orchestration-service/prisma:/app/prisma
    depends_on:
      postgresql:
        condition: service_healthy

  execution-manager:
    build:
      context: ./services/execution-manager
      dockerfile: Dockerfile.dev
    container_name: synaro-execution-manager
    restart: unless-stopped
    ports:
      - '3005:3004'
    environment:
      DATABASE_URL: postgresql://synaro_user:synaro_local_password@postgresql:5432/synaro
      NODE_ENV: development
      PORT: 3004
      LOG_LEVEL: info
      PROJECTS_PATH: /projects
      PROJECTS_VOLUME_PATH: /var/lib/docker/volumes/synaro_projects_data/_data
    volumes:
      - ./services/execution-manager/src:/app/src
      - ./services/execution-manager/prisma:/app/prisma
      - /var/run/docker.sock:/var/run/docker.sock
      - projects_data:/projects
    depends_on:
      postgresql:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_env_data:
  projects_data:
