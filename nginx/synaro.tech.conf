server {
    server_name synaro.tech www.synaro.tech;
    listen 80;
    return 301 https://synaro.tech$request_uri;
}

server {
    server_name synaro.tech www.synaro.tech;
    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/synaro.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synaro.tech/privkey.pem;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    error_log /var/log/nginx/synaro.tech-ssl-error.log;
    access_log /var/log/nginx/synaro.tech-ssl-access.log;
}
