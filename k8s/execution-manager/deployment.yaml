apiVersion: v1
kind: Secret
metadata:
  name: execution-manager-secret
  namespace: synaro
type: Opaque
stringData:
  DATABASE_URL: postgresql://synaro_user:synaro123@postgresql.synaro.svc.cluster.local:5432/synaro

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-manager
  namespace: synaro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execution-manager
  template:
    metadata:
      labels:
        app: execution-manager
    spec:
      serviceAccountName: execution-manager
      containers:
        - name: execution-manager
          image: synaro/execution-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          envFrom:
            - secretRef:
                name: execution-manager-secret
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3004"
            - name: LOG_LEVEL
              value: info
            - name: K8S_NAMESPACE
              value: synaro-projects
            - name: SYNARO_DOMAIN
              value: synaro.ro
            - name: PROJECTS_PATH
              value: /projects
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 300m
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 30
